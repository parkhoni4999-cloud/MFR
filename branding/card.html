<html><head><style>
@font-face{font-family:P;src:url(Pretendard-Black.ttf)} @font-face{font-family:PE;src:url(Pretendard-ExtraBold.ttf)}
*{box-sizing:border-box} body{margin:0;width:1080px;height:1920px;font-family:PE;color:#fff;
 background:linear-gradient(180deg,#123a66 0%,#0a1a33 55%,#050b18 100%);position:relative;overflow:hidden}
.top{position:absolute;top:150px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center}
.no{font-family:P;font-size:44px;color:#ffd23f;letter-spacing:2px}
.brand{font-size:36px;opacity:.85}
.photo{position:absolute;top:260px;left:110px;width:860px;height:700px;border-radius:40px;border:10px solid #ffc21a;
 background:radial-gradient(circle at 50% 45%,#3b6fb0,#0d2546);display:flex;align-items:center;justify-content:center;font-size:330px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.photo span{font-size:28px;position:absolute;bottom:20px;opacity:.6}
.rank{position:absolute;top:220px;right:70px;width:220px;height:220px;border-radius:50%;background:linear-gradient(#ffe680,#ffc21a 55%,#e08a00);
 color:#0b1228;font-family:P;font-size:150px;display:flex;align-items:center;justify-content:center;border:12px solid #0b1228;transform:rotate(-8deg)}
.name{position:absolute;top:1000px;width:100%;text-align:center;font-family:P;font-size:110px}
.name small{display:block;font-family:PE;font-size:40px;color:#9fc6ff;margin-top:6px}
.stats{position:absolute;top:1220px;left:110px;right:110px}
.row{display:flex;align-items:center;margin:26px 0;font-size:46px}
.row b{width:220px} .bar{flex:1;height:38px;background:rgba(255,255,255,.15);border-radius:20px;overflow:hidden;margin:0 24px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc21a,#ffe680);border-radius:20px}
.row em{font-style:normal;font-family:P;width:90px;text-align:right;color:#ffd23f}
.skill{position:absolute;top:1640px;left:110px;right:110px;background:rgba(0,0,0,.45);border:4px solid #ffc21a;border-radius:28px;padding:26px 34px;font-size:40px;line-height:1.45;word-break:keep-all}
.skill strong{color:#ffd23f;font-family:P}
</style></head><body>
<div class="top"><div class="no">도감 No.001</div><div class="brand">사기캐 동물도감</div></div>
<div class="photo">🐙<span>(실제 영상: Pixabay 문어 클립)</span></div>
<div class="rank">S</div>
<div class="name">문어<small>Octopus vulgaris · 바다의 외계인</small></div>
<div class="stats">
 <div class="row"><b>지능</b><div class="bar"><i style="width:95%"></i></div><em>95</em></div>
 <div class="row"><b>위장</b><div class="bar"><i style="width:99%"></i></div><em>99</em></div>
 <div class="row"><b>재생력</b><div class="bar"><i style="width:80%"></i></div><em>80</em></div>
 <div class="row"><b>전투력</b><div class="bar"><i style="width:45%"></i></div><em>45</em></div>
</div>
<div class="skill"><strong>고유 스킬</strong> 심장 3개 · 파란 피 · 팔마다 따로 생각하는 뇌</div>
</body></html>
